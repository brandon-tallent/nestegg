name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  scraper:
    name: Scraper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  tui:
    name: Terminal app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - run: cargo test --locked --manifest-path tui/Cargo.toml

  stack:
    name: Build image and smoke-test the stack
    runs-on: ubuntu-latest
    needs: [scraper, tui]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nestegg:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No Monarch account in CI: bring up the database, load the sample
      # Carta capture through the real image, and render it in the terminal app
      - name: Start the database
        run: |
          printf 'POSTGRES_PASSWORD=citest\nNESTEGG_IMAGE=nestegg:ci\n' > .env
          docker compose up -d --wait postgres
      - name: Load the sample capture
        run: docker compose run --rm -v "$PWD/examples:/examples:ro" sync cli --load-carta /examples/carta-sample.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - name: Render the Equity screen
        run: |
          cargo install --path tui --locked
          nestegg --database postgresql://nestegg:citest@localhost:5432/nestegg \
            --dump --screen equity --keys enter | tee equity.txt
          grep -q "Acme Rockets" equity.txt
          grep -q "ISO/NSO Split" equity.txt

      - name: Publish the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag nestegg:ci "$IMAGE:latest"
          docker tag nestegg:ci "$IMAGE:${GITHUB_SHA::8}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::8}"
