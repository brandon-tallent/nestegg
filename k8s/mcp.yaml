# Apply separately after provisioning nestegg-mcp-secrets; see docs/MCP.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestegg-mcp
  namespace: nestegg
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: nestegg-mcp
  template:
    metadata:
      labels:
        app: nestegg-mcp
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      hostUsers: false
      containers:
        - name: mcp
          # deploy-mcp.sh replaces this with an immutable build tag.
          image: nestegg-mcp:local
          ports:
            - name: mcp
              containerPort: 8091
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nestegg-mcp-secrets
                  key: DATABASE_URL
            - name: NESTEGG_MCP_BIND
              value: 0.0.0.0:8091
            # deploy-mcp.sh appends the node's own names (MCP_ALLOWED_HOSTS)
            - name: NESTEGG_MCP_ALLOWED_HOSTS
              value: localhost,127.0.0.1,nestegg-mcp,nestegg-mcp.nestegg.svc.cluster.local
            - name: RUST_LOG
              value: info,rmcp=warn
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '2'
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: mcp
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: nestegg-mcp
  namespace: nestegg
spec:
  type: ClusterIP
  selector:
    app: nestegg-mcp
  ports:
    - name: mcp
      port: 8091
      targetPort: mcp
