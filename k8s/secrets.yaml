# nestegg secrets (template)
#
# Real values are NOT kept in git. Create the secret directly instead:
#
#   kubectl -n nestegg create secret generic nestegg-secrets \
#     --from-literal=POSTGRES_USER=nestegg \
#     --from-literal=POSTGRES_DB=nestegg \
#     --from-literal=POSTGRES_PASSWORD="$PASSWORD" \
#     --from-literal=DATABASE_URL="postgresql://nestegg:$PASSWORD@postgres.nestegg.svc.cluster.local:5432/nestegg" \
#     --from-literal=MONARCH_EMAIL=... \
#     --from-literal=MONARCH_PASSWORD=...
#
# Optional: NTFY_URL. Notifications include net worth, and ntfy.sh topics are
# public to anyone who knows the name, so only set it to a self-hosted server
# or an unguessable topic.
apiVersion: v1
kind: Secret
metadata:
  name: nestegg-secrets
  namespace: nestegg
type: Opaque
stringData:
  POSTGRES_USER: nestegg
  POSTGRES_DB: nestegg
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgresql://nestegg:CHANGE_ME@postgres.nestegg.svc.cluster.local:5432/nestegg
  MONARCH_EMAIL: CHANGE_ME
  MONARCH_PASSWORD: CHANGE_ME
